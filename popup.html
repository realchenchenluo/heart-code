<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f16">
<title>弹窗爱心 · 万事胜意</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    overflow:hidden;background:#0c0f16;color:#e8ecf4;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background-image:
      radial-gradient(circle at 50% 44%, rgba(96,132,220,.18), rgba(12,15,22,0) 62%),
      radial-gradient(rgba(255,255,255,.05) 1px, rgba(0,0,0,0) 1px);
    background-size:100% 100%,24px 24px;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed;inset:0;transform-origin:50% 50%;will-change:transform}
  .win{
    position:absolute;left:0;top:0;width:var(--w);height:var(--h);
    background:#fff;border-radius:3px;transform-origin:50% 50%;
    box-shadow:0 14px 28px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.55);
    will-change:transform,opacity;
  }
  .tb{
    height:var(--tbh);display:flex;align-items:center;gap:var(--g);padding:0 var(--g);
    background:linear-gradient(#fff,#f1f1f1);border-bottom:1px solid rgba(0,0,0,.08);
    border-radius:3px 3px 0 0;color:#5a5f66;font-size:var(--fs);line-height:1;overflow:hidden;
  }
  .tb .ico{color:#e8618c;flex:none}
  .tb .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4a4f57;opacity:.85}
  .tb svg{flex:none;display:block;opacity:.72}
  .bd{
    height:calc(100% - var(--tbh));background:var(--c);display:flex;align-items:center;justify-content:center;
    border-radius:0 0 3px 3px;font-size:var(--fs);color:rgba(70,60,70,.92);letter-spacing:.06em;
  }
  .win.center{
    box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 38px rgba(255,110,165,.5),inset 0 0 0 1px rgba(255,255,255,.75);
  }
  .win.center .bd{background:#fff;color:#171b21;font-weight:600;letter-spacing:.16em}
  .hint{
    position:fixed;left:0;right:0;top:18px;text-align:center;z-index:5;
    color:#66748e;font-size:12px;letter-spacing:.14em;pointer-events:none;
  }
  .hud{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:99999;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;
    max-width:calc(100vw - 24px);padding:8px 12px 8px 16px;border-radius:24px;
    background:rgba(18,22,32,.74);border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:13px;
  }
  .hud .heart{color:#ff6fa5}
  .hud input{
    width:9.5em;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.07);color:#fff;font-size:13px;outline:none;
    font-family:inherit;
  }
  .hud input:focus{border-color:rgba(255,111,165,.7)}
  .hud button{
    padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.16);cursor:pointer;
    background:rgba(255,111,165,.16);color:#ffd9e6;font-size:13px;font-family:inherit;white-space:nowrap;
  }
  .hud button:hover{background:rgba(255,111,165,.32)}
  .hud a{color:#9aa6bd;text-decoration:none;padding:0 4px;white-space:nowrap}
  .hud a:hover{color:#fff}
  body.preview .hud,body.preview .hint{display:none}
  @media (max-width:560px){
    .hud{gap:6px;padding:7px 10px;font-size:12px}
    .hud input{width:6.5em}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hint" id="hint">点击画面，让爱心重新拼一次</div>
<div class="hud">
  <span class="heart">&#9829;</span>
  <input id="msg" value="万事胜意" maxlength="12" aria-label="想说的话">
  <button id="again">重新拼一次</button>
  <a href="./">返回</a>
</div>

<script>
(function(){
  var PREVIEW = new URLSearchParams(location.search).has('preview');
  if (PREVIEW) document.body.classList.add('preview');

  var stage = document.getElementById('stage');
  var hintEl = document.getElementById('hint');
  var msgEl = document.getElementById('msg');
  var PALETTE = ['#f7b8c6','#f6d9a9','#f0eaa8','#b6e2c5','#b3d6f0','#c7bcef','#f5c5e4','#a9dfda'];
  var wins = [], S = 1, cx = 0, cy = 0, t0 = performance.now()/1000;

  // 经典心形参数方程，+1.5 让图形在竖直方向居中
  function heartPoint(t){
    var s = Math.sin(t), c = Math.cos(t);
    var x = 16 * s * s * s;
    var y = 13 * c - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t) + 1.5;
    return [x, y];
  }
  function easeOutCubic(p){ return 1 - Math.pow(1-p, 3); }

  // 按弧长均匀取点。参数 t 均匀采样时，尖点附近 x 是 t 的三次方，
  // 一大串窗口会挤在同一个位置上堆成一坨，所以先建弧长表再等距取点。
  var ARC_N = 2400, ARC = [], ARC_TOTAL = 0;
  function buildArc(){
    ARC = new Array(ARC_N + 1);
    var k, prev, d;
    for (k=0; k<=ARC_N; k++) ARC[k] = heartPoint(k/ARC_N * Math.PI*2);
    var cum = new Array(ARC_N + 1); cum[0] = 0;
    for (k=1; k<=ARC_N; k++){
      var dx = ARC[k][0] - ARC[k-1][0], dy = ARC[k][1] - ARC[k-1][1];
      cum[k] = cum[k-1] + Math.sqrt(dx*dx + dy*dy);
    }
    ARC_TOTAL = cum[ARC_N];
    ARC = {p: ARC, cum: cum};
  }
  function atArc(s){
    var cum = ARC.cum, p = ARC.p, n = ARC_N;
    s = ((s % ARC_TOTAL) + ARC_TOTAL) % ARC_TOTAL;
    var lo = 0, hi = n;
    while (lo < hi - 1){
      var mid = (lo + hi) >> 1;
      if (cum[mid] <= s) lo = mid; else hi = mid;
    }
    var seg = cum[hi] - cum[lo] || 1;
    var f = (s - cum[lo]) / seg;
    return [p[lo][0] + (p[hi][0]-p[lo][0])*f, p[lo][1] + (p[hi][1]-p[lo][1])*f];
  }

  function titleBar(fs){
    var w = Math.round(fs*2.4), h = Math.round(fs*0.62);
    return '<div class="tb"><span class="ico">&#9829;</span><span class="ttl"></span>' +
      '<svg width="'+w+'" height="'+h+'" viewBox="0 0 52 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">' +
      '<line x1="1" y1="7" x2="11" y2="7"/>' +
      '<rect x="20" y="1.5" width="11" height="11" rx="1.5"/>' +
      '<path d="M40 1.5 L51 12.5 M51 1.5 L40 12.5"/></svg></div>';
  }

  function makeWin(w, h, tbh, fs, cls){
    var el = document.createElement('div');
    el.className = 'win' + (cls ? ' ' + cls : '');
    el.style.setProperty('--w', w + 'px');
    el.style.setProperty('--h', h + 'px');
    el.style.setProperty('--tbh', tbh + 'px');
    el.style.setProperty('--fs', fs + 'px');
    el.style.setProperty('--g', Math.max(3, Math.round(w*0.05)) + 'px');
    el.style.marginLeft = (-w/2) + 'px';
    el.style.marginTop  = (-h/2) + 'px';
    return el;
  }

  function build(){
    var vw = innerWidth, vh = innerHeight;
    var heartW = Math.min(vw * (vw < 680 ? 0.92 : 0.80), vh * (PREVIEW ? 0.74 : 0.86));
    S  = heartW / 32;
    cx = Math.round(vw/2);
    cy = Math.round(vh/2 - (PREVIEW ? 0 : vh*0.015));

    var N   = PREVIEW ? 56 : (vw < 680 ? 64 : 96);
    var w   = Math.max(30, 4.7*S);
    var h   = Math.max(18, 3.15*S);
    var tbh = Math.max(8, Math.round(h*0.32));
    var fs  = Math.max(7, Math.round(h*0.26));

    stage.innerHTML = '';
    wins = [];
    var frag = document.createDocumentFragment();

    var step = ARC_TOTAL / N, half = step * 0.22, gap = step * 0.5;
    for (var i=0; i<N; i++){
      // 错开半个步长，避免正好落在 t=0 的尖点上
      var s = (i + 0.5) * step;
      // 顶部凹陷与底部心尖是两个尖点，切线在那里会翻转。落得太近的窗口直接跳过：
      // 窗口之间本来就有好几层重叠，留个小空档反而干净。
      var cuspDist = Math.min(Math.min(s, ARC_TOTAL - s), Math.abs(s - ARC_TOTAL/2));
      if (cuspDist < gap) continue;
      var pt = atArc(s);
      var tx = cx + pt[0]*S, ty = cy - pt[1]*S;

      // 窗口长边沿着心形曲线的切线方向
      var a = atArc(s - half), b = atArc(s + half);
      var rot = Math.atan2(-(b[1]-a[1]), (b[0]-a[0])) * 180/Math.PI;

      // 尖点附近曲线很陡，整扇窗口摆在那里会有半个身子探进心形空腔。
      // 越靠近尖点缩得越小，看上去就像丝带在急转弯处收窄。
      var k = 1 - 0.40 * Math.exp(-Math.pow(cuspDist/(step*2.4), 2));
      var el = makeWin(w*k, h*k, Math.max(8, tbh*k), Math.max(7, fs*k));
      el.innerHTML = titleBar(fs) + '<div class="bd" style="--c:'+PALETTE[i % PALETTE.length]+'"></div>';
      el.style.zIndex = String(10 + i);

      var dx = tx-cx, dy = ty-cy;
      var rec = {
        el: el, tx: tx, ty: ty, rot: rot, ph: Math.random()*6.283,
        fx: cx + dx*2.4 + (Math.random()*2-1)*60,
        fy: cy + dy*2.4 + (Math.random()*2-1)*60,
        spin: (Math.random()*2-1)*110,
        delay: i*0.016 + Math.random()*0.06,
        hover: false, op: -1
      };
      el.addEventListener('mouseenter', function(){ rec.hover = true; });
      el.addEventListener('mouseleave', function(){ rec.hover = false; });
      wins.push(rec);
      frag.appendChild(el);
    }

    // 中间那扇写着心里话的窗口
    var cw = Math.max(58, 6.6*S), ch = Math.max(34, 3.7*S);
    var cwin = makeWin(cw, ch, Math.max(9, Math.round(ch*0.30)), Math.max(8, Math.round(ch*0.23)), 'center');
    cwin.innerHTML = '<div class="tb"><span class="ico">&#9829;</span><span class="ttl"></span>' +
      '<svg width="'+Math.round(ch*0.55)+'" height="'+Math.round(ch*0.14)+'" viewBox="0 0 52 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">' +
      '<line x1="1" y1="7" x2="11" y2="7"/><rect x="20" y="1.5" width="11" height="11" rx="1.5"/>' +
      '<path d="M40 1.5 L51 12.5 M51 1.5 L40 12.5"/></svg></div>' +
      '<div class="bd" id="ctext"></div>';
    cwin.style.zIndex = '9999';
    var crec = {
      el: cwin, tx: cx, ty: cy - S*1.1, rot: 0, ph: 1.7,
      fx: cx, fy: cy + Math.max(240, vh*0.5), spin: 18, delay: 1.5,
      hover: false, op: -1
    };
    cwin.addEventListener('mouseenter', function(){ crec.hover = true; });
    cwin.addEventListener('mouseleave', function(){ crec.hover = false; });
    wins.push(crec);
    frag.appendChild(cwin);

    stage.appendChild(frag);
    applyMsg();
    if (hintEl) hintEl.textContent = '点击画面，让爱心重新拼一次 · 共 ' + N + ' 个窗口';
  }

  function frame(now){
    var t = now/1000 - t0;
    var x = (t % 1.15) / 1.15;
    var g = function(c, s){ var d = (x-c)/s; return Math.exp(-d*d); };
    var pulse = 1 + 0.042 * (g(0.10,0.05) + 0.55*g(0.30,0.055));
    stage.style.transform = 'scale(' + pulse.toFixed(4) + ')';

    for (var i=0; i<wins.length; i++){
      var wk = wins[i];
      var p = (t - wk.delay) / 0.62;
      p = p < 0 ? 0 : (p > 1 ? 1 : p);
      var e = easeOutCubic(p);
      var px = wk.fx + (wk.tx - wk.fx) * e;
      var py = wk.fy + (wk.ty - wk.fy) * e;
      var rot = wk.rot + (1-e) * wk.spin;
      var pop = 1 + 0.10 * Math.sin(Math.PI * Math.min(1, Math.max(0, (p-0.72)/0.28)));
      var sc = (0.4 + 0.6*e) * pop * (wk.hover ? 1.09 : 1);
      var jx = Math.sin(t*0.9  + wk.ph) * 1.3;
      var jy = Math.cos(t*1.15 + wk.ph) * 1.3;
      var jr = Math.sin(t*0.65 + wk.ph) * 1.0;

      wk.el.style.transform = 'translate3d(' + (px+jx).toFixed(1) + 'px,' + (py+jy).toFixed(1) + 'px,0) ' +
                              'rotate(' + (rot+jr).toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
      var op = p < 0.25 ? p*4 : 1;
      if (Math.abs(op - wk.op) > 0.02){ wk.el.style.opacity = op.toFixed(2); wk.op = op; }
    }
    requestAnimationFrame(frame);
  }

  function restart(){
    t0 = performance.now()/1000;
    for (var i=0; i<wins.length; i++){
      var wk = wins[i];
      wk.ph = Math.random()*6.283;
      wk.spin = (Math.random()*2-1)*110;
      wk.delay = (wk.delay > 1 ? 1.4 : i*0.012) + Math.random()*0.35;
    }
  }

  function applyMsg(){
    var m = (msgEl.value || '').trim().slice(0, 12) || '万事胜意';
    var c = document.getElementById('ctext');
    if (c) c.textContent = m;
    document.title = '弹窗爱心 · ' + m;
  }

  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('.hud')) return;
    restart();
  });
  document.getElementById('again').addEventListener('click', restart);
  msgEl.addEventListener('input', applyMsg);

  var rt = null;
  addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ build(); }, 180);
  });

  buildArc();
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
